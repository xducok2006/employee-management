services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: employee_management_db
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    container_name: hr-redis
    ports:
      - "6379:6379"